<div class="card p-5 h-full gap-2 flex flex-col rounded-2xl border p-7">
    <div class="flex flex-col items-center justify-between">
        <h1 class="text-xl main-title font-bold">Balance total</h1>
        <div class="flex items-center gap-3 my-2">
            <input [ngModel]="displayValue" (ngModelChange)="onModelChange($event)" type="text" class="principal text-4xl text-center"/>
        </div>
    </div>
    <div class="border-t pt-4"></div>
    <div class="flex flex-col items-center gap-2 justify-center">
        <div class="flex items-center gap-2">
            <p class="text-lg text-center principal">Disponible para usar:</p>
            <span class="text-sm text-gray-800" [ngClass]="statusColor">{{
                budgetService.totalPercentage | number:'1.0-2' }}%</span>
        </div>
        <div class="flex items-center">
            <p class="principal">
                <app-percentage-calculator [totalBalance]="budgetService.totalBalance()"></app-percentage-calculator>
            </p>
        </div>
    </div>
</div>

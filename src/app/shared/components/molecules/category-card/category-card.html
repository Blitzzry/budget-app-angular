<div class="card flex flex-col p-5 w-full justify-between">
    <div class="flex items-center space-between gap-4">
        <p class="principal text-lg">Mis categorias</p>
        <input [(ngModel)]="newCategory.name" placeholder="Nombre" class="principal"/>
        <input [(ngModel)]="newCategory.percentage" type=number placeholder="Porcentaje" class="principal"/>
        <button (click)="addCategory()" class="button p-2 cursor-pointer rounded flex items-center gap-1">
            <div class="flex items-center">
            <app-icon  name="plus" [size]="'xxs'"></app-icon>
            Agregar categoria
            </div>
        </button>
    </div>
    <div class="flex flex-col mt-2">
        @for (item of exampleCategories; track $index) {
            <app-category [categoryName]="item.name" [iconName]="item.iconName" [assignedAmount]="item.assignedAmount" [percentage]="item.percentage"/>
        }
    </div>
</div>

<div class="card flex flex-col p-5 w-full justify-between max-h-80 overflow-y-auto">
    <div class="flex items-center space-between gap-4 justify-between">
        <p class="principal text-lg">Mis categorias</p>
        <input [(ngModel)]="newCategory.name" placeholder="Nombre" class="principal"/>
        <input [(ngModel)]="newCategory.percentage" type=number placeholder="Porcentaje" class="principal"/>
        <button (click)="addCategory()" class="ml-2 text-btn">
            <app-icon  name="plus" [size]="'xxs'"></app-icon>
            Agregar categoria
        </button>
    </div>
    <div class="flex flex-col mt-2">
        @for (item of budgetService.categories(); track $index) {
            <app-category [categoryName]="item.name" [iconName]="item.iconName" [assignedAmount]="item.assignedAmount" [percentage]="item.percentage" [id]="item.id" (remove)="removeCategory($event)" (lock)="lockCategory($event)" (edit)="editCategory($event.id, $event.category)"/>
        }
    </div>
</div>

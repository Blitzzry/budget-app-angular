<div class="card p-5 h-full">
  @if (type === 'income') {
    <app-icon name="arrow-up-circle" class="income" [size]="16"></app-icon>
    <p class="principal my-1">Ingresos</p>
  } @else {
    <app-icon name="arrow-down-circle" class="expenses" [size]="16"></app-icon>
    <p class="principal my-1">Gastos</p>
  }
  <h1 class="principal text-2xl my-1">${{ total | number:'1.2-2'}}</h1>
  <p class="secundary">{{ percentageDiff }}% vs el mes pasado</p>
</div>

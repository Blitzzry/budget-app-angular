<div class="auth-card flex items-center justify-center flex-col gap-2 mt-6">
    <h1 class="text-3xl my-4 main-title font-semibold text-gray-800">Getter</h1>
    <span class="text-2xl font-bold text-white">Bienvenido de vuelta!</span>
    <span class="text-sm secundary mb-5">Logueate para continuar con tu presupuesto</span>
    <div class="flex flex-col w-full gap-1.5">
        <span class="text-sm text-white">Correo electrónico</span>
        <input class="auth-input" type="email" placeholder="your@email.com" [(ngModel)]="email" />
        <span class="text-sm text-white">Contraseña</span>
        <input class="auth-input" type="password" placeholder="....." [(ngModel)]="password" />
        <div class="flex my-4 justify-between">
            <label class="flex items-center gap-1.5 text-sm" style="color:#5C554C;">
                <input [(ngModel)]="rememberMe" type="checkbox" style="width:14px;height:14px;accent-color:#C4A86A;" />
                Recuérdame
            </label>
            <button class="text-sm text-gray-600 hover:underline mt-1">¿Olvidaste tu contraseña?</button>
        </div>
        <button class="log-in-btn my-2" (click)="logIn()">Ingresar!</button>
    </div>
    <div class="flex flex-col gap-2 items-center w-full">
        <span class="text-sm mt-1 mb-2 secundary">¿No tienes una cuenta?
            <a href="#" routerLink="/signUp" class="sign-up-btn hover:underline">Regístrate</a></span>
    </div>
</div>

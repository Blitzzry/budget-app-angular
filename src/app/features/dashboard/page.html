<div class="p-6">
    <app-topbar (loginClick)="goToLogin()" (signUpClick)="goToSignUp()" (signOutClick)="authService.signOut()"
        [isUserLogged]="authService.userIsLoggedIn()"
        [userName]="authService.currentUser()?.user_metadata?.['name']"></app-topbar>
    <h1 class="text-2xl ml-4 main-title">{{ budgetService.uiConfig()?.appName }}</h1>
    <div class="total-presets gap-4 mt-4 md:mx-4">
        <app-total-balance class="h-full" />
        <app-preset-card class="h-full" />
        <app-create-distribute-cat></app-create-distribute-cat>
    </div>
    <div class="mt-4 flex flex-col justify-between gap-4">
        <app-category-card class="w-full" />
    </div>
</div>
